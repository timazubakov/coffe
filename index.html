<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffea</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
        <div class="container">
            <nav>
                <div class="logo">coffea</div>
                <div class="nav_links">
                    <a href="#">home</a>
                    <a href="#">coffee</a>
                    <a href="#">bakery</a>
                    <a href="#">shop</a>
                    <a href="#">about</a>
                    <a href="#">login</a>
                </div>
                <div class="search_icon">
                    <img src="img/search.png" alt="S">
                </div>
            </nav>

            <div class="hero_content">
                <div class="hero_text">
                    <p class="welcome">WELCOME</p>
                    <h1>We serve the richest coffee in the city!</h1>
                    <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                    <a href="#" class="order_btn">Order Now</a>
                </div>
                <div class="hero_image">
                    <img src="img/coffee_cup.png" alt="Coffee Cup">
                </div>
            </div>
        </div>
    </header>

    <section class="categories swiper mySwiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide category_item active">
                <img src="img/icon1.png" alt="">
                <p>Hot Coffee</p>
            </div>
            <div class="swiper-slide category_item">
                <img src="img/icon2.png" alt="">
                <p>Cold Coffee</p>
            </div>
            <div class="swiper-slide category_item">
                <img src="img/icon3.png" alt="">
                <p>Cup Coffee</p>
            </div>
            <div class="swiper-slide category_item">
                <img src="img/icon4.png" alt="">
                <p>Dessert</p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 4,
            spaceBetween: 30,
            breakpoints: {
                320: { slidesPerView: 2 },
                768: { slidesPerView: 4 }
            }
        });
    </script>

  
</body>
</html>
